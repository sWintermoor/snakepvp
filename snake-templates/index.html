<!DOCTYPE html>
<html>
    <head>
        <title>SnakePvP</title>
        <link rel="stylesheet" href="../snake-static/snake-css/style.css">
        <script src="../snake-static/snake-js/racket-base.js"></script>
        <script src="../snake-static/snake-js/game.js"></script>
    </head>

    <body>
        <header>
            <nav>
                <ul>
                    <li><a href="index.html">SnakePvP</a></li>
                    <li><a>Blog</a></li>
                    <li><a>Support</a></li>
                </ul>
            </nav>
            <h1>SnakePvP</h1>
        </header>
        <section id="game-container"></section>
        <script>
            // Initialisiere dein Spiel
            window.onload = function() {
                racket.runGame("game-container");
            };
        </script>
        <section>
            <button onclick="changeText()">Play</button>
            <p id="message"></p> <!-- Hier fügen wir das Element mit der ID 'message' hinzu -->
            <script>
                // JavaScript
                function changeText() {
                    // Get the element with the ID 'message'
                    const messageElement = document.getElementById('message');
                    
                    // Change its text content
                    messageElement.textContent = 'You clicked the button!';
                }
            </script>
        </section>
        <footer>footer</footer>
    </body>
</html>
